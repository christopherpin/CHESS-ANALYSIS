name: Build puzzle data
# Downloads the Lichess open puzzle database (CC0) and rebuilds data/puzzles.
on:
  workflow_dispatch:
  push:
    paths: [scripts/build_puzzles.py, .github/workflows/build-puzzles.yml]
  schedule:
    - cron: "0 6 1 * *"   # monthly refresh
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and build
        run: |
          curl -fsSL -o puzzles.csv.zst https://database.lichess.org/lichess_db_puzzle.csv.zst
          rm -rf data/puzzles
          zstd -dc puzzles.csv.zst | python3 scripts/build_puzzles.py data/puzzles
          rm puzzles.csv.zst
          du -sh data/puzzles
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/puzzles
          git diff --cached --quiet || git commit -m "Rebuild puzzle data from Lichess database"
          git pull --rebase origin main && git push
